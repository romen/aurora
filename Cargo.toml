[package]
name = "qubip_aurora"
version = "0.12.0+dev"
edition = "2021"
resolver = "3"
rust-version = "1.85"
description = "A framework to build OpenSSL Providers tailored for the transition to post-quantum cryptography"
license = "Apache-2.0"
repository = "https://github.com/QUBIP/aurora"
homepage = "https://qubip.eu"
exclude = ["tests/data"]

[lib]
crate-type = ["cdylib"]
name = "aurora"

[features]
# default = ["env_logger", "export"]
default = [
  "env_logger",
  "built_info",
  "default_adapters",
  "_composite_sigs_draft_13",
]
default_adapters = [
  "libcrux_adapter",
  "rustcrypto_adapter",
  "slhdsa_c_adapter",
  "mldsa_native_adapter",
  #"pqclean_adapter",
]
env_logger = ["dep:env_logger"]
skip_troublesome_wycheproof = []
export = []
native = ["mldsa-native-rs?/native"]
built_info = ["dep:built", "dep:git2", "mldsa-native-rs?/built_info"]

# One (and not more than one!) of the _draft_N features must be enabled to support `_composite_mldsa_eddsa`!
# These features are _experimental_: they will be removed in an upcoming release once the composite_sigs draft graduates to RFC.
# You have been warned: DO NOT DEPEND ON THEM!
_composite_sigs_draft_13 = []

# These features are _private_: they are automatically enabled by the selection of adapters.
# DO NOT MANUALLY ENABLE THEM IN CARGO.TOML
_mldsa = []
_slhdsa = []
_mlkem_hybrids = []
_composite_mldsa_eddsa = []
_build_cdylib_before_integration_tests = []

libcrux_adapter = ["dep:libcrux-kem", "_mlkem_hybrids"]
pqclean_adapter = [
  "dep:pqcrypto-mldsa",
  "dep:pqcrypto-traits",
  "dep:ml-dsa",
  "dep:ed25519-dalek",
  "dep:sha2",
  "_transcoders_deps",
  "_mldsa",
  "_composite_mldsa_eddsa",
]
rustcrypto_adapter = ["dep:slh-dsa",  "dep:typenum", "dep:der", "_transcoders_deps", "_slhdsa"]
slhdsa_c_adapter = [
  "dep:slhdsa-c-rs",
  "dep:der",
  "_transcoders_deps",
  "_slhdsa",
]
mldsa_native_adapter = [
  "dep:ed25519-dalek",
  "dep:mldsa-native-rs",
  "dep:sha2",
  "_transcoders_deps",
  "_mldsa",
  "_composite_mldsa_eddsa",
]

# This feature is _private_: it collects all the dependencies for transcoders
_transcoders_deps = ["dep:pem", "dep:pkcs8", "dep:rasn"]

# Some exact "=" pins below are deliberate: these crates have shipped
# breaking changes and/or MSRV bumps in patch releases, so we pin them
# exactly rather than allowing automatic patch upgrades.
# Do not loosen without testing.
#
# Pre-release versions are usually pinned to avoid release churn and due to
# general lack of semver guarantees.
[dependencies]
function_name = "0.3"
libc = "0.2"
log = { version = "0.4", features = ["release_max_level_info"] }
#openssl_provider_forge = { git = "https://github.com/qubip/openssl-provider-forge-rs", tag = "v0.9.0" }
openssl_provider_forge = "0.10"
env_logger = { version = "0.11.11", optional = true }
anyhow = "1.0"
lazy_static = "1.5.0"
asn1 = "0.24"
rand = "0.10"
rasn = { version = "=0.27.0", optional = true } # pinned: 0.27.1+ requires rustc >= 1.87.0
der = { version = "0.8", optional = true }
pem = { version = "3.0.6", optional = true }
pkcs8 = { version = "0.11", features = ["alloc"], optional = true }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"], optional = true }
ml-dsa = { version = "0.1.1", optional = true }
slh-dsa = { version = "=0.2.0-rc.5", optional = true } # pinned: pre-release
libcrux-kem = { version = "0.0.8", default-features = false, optional = true }
slhdsa-c-rs = { version = "0.0.5", optional = true }
pqcrypto-mldsa = { version = "0.1.2", optional = true }
pqcrypto-traits = { version = "0.3.5", optional = true }
mldsa-native-rs = { version = "=0.0.1-alpha.6", optional = true } # pinned: pre-release
sha2 = { version = "0.11", optional = true }
itertools = "0.15"
constcat = "0.6.1"
cfg-if = "1.0.4"
signature = { version = "3.0.0", features = ["alloc"] }
typenum = { version = "1.20.1", optional = true }

[build-dependencies]
rasn-compiler = "0.16"
# `built` generates $OUT_DIR/built.rs; the `git2` feature adds GIT_DIRTY,
# GIT_COMMIT_HASH, etc.
built = { version = "0.8.0", features = ["git2"], optional = true }
# Used directly by build.rs to detect repo presence and working-tree dirtiness
# so we can tune the rerun-if-changed policy. Shares libgit2 with built/git2.
# default-features = false keeps network/ssh features (and their heavier deps)
# out; local repo status does not need them.
git2 = { version = "0.20.4", default-features = false, optional = true }

[dev-dependencies]
regex = "1"
tempfile = "3"
serde_json = "1.0.150"
paste = "1.0"
wycheproof = { git = "https://github.com/eferollo/wycheproof-rs", branch = "composite-mldsa-draft13" }
